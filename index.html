    // સેવ કરેલો દેખાવ અને ઝૂમ પહેલા જ લાગુ (સફેદ-કાળું ઝબકે નહીં)
    try {
      var t = JSON.parse(localStorage.getItem('gj:theme') || '"auto"');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var z = JSON.parse(localStorage.getItem('gj:zoom') || '100');
      if ([80, 90, 110, 120].indexOf(z) > -1) document.documentElement.dataset.zoom = String(z);
    } catch (e) {}
  </script>
