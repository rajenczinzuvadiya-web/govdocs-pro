<!doctype html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ગામની જાણકારી</title>
  <meta name="description" content="ગામના દરેક માણસ માટે સરકારી યોજના, સહાય, ભરતી અને જરૂરી માહિતી, સરળ ગુજરાતીમાં અને બોલીને.">
  <meta name="theme-color" content="#14663a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><img src="icons/icon-192.png" alt="" width="32" height="32"><span data-app-name>ગામની જાણકારી</span></a>
    <div class="top-actions">
      <button id="text-size" class="icon-btn text-size-btn" type="button" aria-label="અક્ષર મોટા કરો">અ<span>+</span></button>
      <a class="icon-btn" href="#/profile" aria-label="મારી પ્રોફાઇલ">👤</a>
    </div>
  </header>

  <main id="view" class="wrap" tabindex="-1"></main>

  <nav class="nav" aria-label="મુખ્ય મેનુ">
    <a href="#/" data-route="home"><span aria-hidden="true">🏠</span>મારા માટે</a>
    <a href="#/all" data-route="all"><span aria-hidden="true">📋</span>બધી યોજના</a>
    <a href="#/today" data-route="today"><span aria-hidden="true">📰</span>આજનું</a>
    <a href="#/saved" data-route="saved"><span aria-hidden="true">⭐</span>સેવ કરેલ</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="wrap">આ એપ ચલાવવા JavaScript ચાલુ કરો.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
