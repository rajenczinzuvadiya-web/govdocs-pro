<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Packaging Studio</title>
<meta name="description" content="Theme-driven product packaging mockups and A4 company letterpads. Packaging, label, colour, text and letterpad stay independently editable.">
<meta name="theme-color" content="#2e8a96">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Noto+Sans+Gujarati:wght@400;700&family=Noto+Serif+Gujarati:wght@400;700&family=Hind+Vadodara:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="vendor/jspdf.umd.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="top">
  <span class="swatch" id="brandSwatch"></span>
  <div class="brand">
    <input id="projName" type="text" aria-label="Project name">
    <div class="sub">Packaging Studio · design and mockup stage</div>
  </div>
  <button class="btn" id="installBtn" hidden>Install app</button>
  <div id="saveState">Loading…</div>
</header>
<nav class="tabs"><div class="tabs-in" role="tablist">
  <button class="tab" data-tab="theme" role="tab">Theme</button>
  <button class="tab" data-tab="product" role="tab">Products</button>
  <button class="tab" data-tab="letterpad" role="tab">Letterpad</button>
  <button class="tab" data-tab="project" role="tab">Projects</button>
  <button class="tab" data-tab="checks" role="tab">Checks</button>
</div></nav>
<main id="view"><p class="muted" style="padding:20px">Loading…</p></main>
<div id="toast" role="status"></div>
<noscript><p style="padding:20px">Packaging Studio needs JavaScript.</p></noscript>
</body>
</html>
